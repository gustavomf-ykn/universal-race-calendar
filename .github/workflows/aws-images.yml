name: AWS immutable images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require reviewed main release
        run: test "${GITHUB_REF}" = refs/heads/main
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/gustavomf-ykn/runfinder-api:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        id: results
        with:
          context: .
          file: apps/openresults-worker/Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ghcr.io/gustavomf-ykn/runfinder-results:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Release digests
        run: |
          echo "API_IMAGE=ghcr.io/gustavomf-ykn/runfinder-api@${{ steps.api.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "RESULTS_IMAGE=ghcr.io/gustavomf-ykn/runfinder-results@${{ steps.results.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "RELEASE_SHA=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

# No automatic deploy, AWS secrets, task dispatch or schedules.
