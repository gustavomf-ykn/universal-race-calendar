name: Legacy import entry point
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/enqueue-catalog.mjs
        env:
          API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
          API_KEY: ${{ secrets.PRODUCTION_INTERNAL_API_KEY }}
          QUANTITY: '25'
