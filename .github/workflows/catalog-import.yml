name: Catalog Import
on:
  workflow_dispatch:
    inputs:
      quantity:
        description: Maximum events per source (1-500)
        default: '100'
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: read
concurrency:
  group: durable-catalog-enqueue
  cancel-in-progress: false
jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/enqueue-catalog.mjs
        env:
          API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
          API_KEY: ${{ secrets.PRODUCTION_INTERNAL_API_KEY }}
          QUANTITY: ${{ inputs.quantity || '100' }}
