# Only a free staging API. No workers, database, disk or automatic deployment.
services:
  - type: web
    name: race-platform-staging-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    dockerCommand: node scripts/start-staging-api.mjs
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      - key: SUPABASE_URL
        value: https://sggrijhyblejlgimgzzc.supabase.co
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: AI_CURATION_ENABLED
        value: 'false'
      - key: AI_CURATION_REQUIRED
        value: 'false'
