services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: race_backend_test
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["race-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d race_backend_test"]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:local-development-only@postgres:5432/race_backend_test
      DIRECT_URL: postgresql://postgres:local-development-only@postgres:5432/race_backend_test
      WORKER_DATABASE_URL: postgresql://postgres:local-development-only@postgres:5432/race_backend_test
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
  calendar-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["node","apps/worker/dist/apps/worker/src/queue.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:local-development-only@postgres:5432/race_backend_test
      DIRECT_URL: postgresql://postgres:local-development-only@postgres:5432/race_backend_test
      WORKER_DATABASE_URL: postgresql://postgres:local-development-only@postgres:5432/race_backend_test
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  results-worker:
    build:
      context: .
      dockerfile: apps/openresults-worker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:local-development-only@postgres:5432/race_backend_test
      DIRECT_URL: postgresql://postgres:local-development-only@postgres:5432/race_backend_test
      WORKER_DATABASE_URL: postgresql://postgres:local-development-only@postgres:5432/race_backend_test
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  race-db:
