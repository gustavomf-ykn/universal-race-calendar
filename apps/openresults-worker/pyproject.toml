[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper-openresults"
version = "1.0.0"
description = "Aplicação web para consolidar e exportar resultados públicos do Open Results"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = ["fastapi", "scraping", "openresults", "running", "xlsx"]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "aiosqlite==0.21.0",
    "lxml>=5.2,<7",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "playwright==1.62.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[project.urls]
Homepage = "https://gustavomf-ykn.github.io/scraper-openresults/"
Documentation = "https://github.com/gustavomf-ykn/scraper-openresults/tree/main/docs"
Repository = "https://github.com/gustavomf-ykn/scraper-openresults"
Issues = "https://github.com/gustavomf-ykn/scraper-openresults/issues"

[tool.setuptools.packages.find]
include = ["app*"]
